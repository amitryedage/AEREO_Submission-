[project]
name = "certgen"
version = "0.1.0"
description = "Bulk Certificate Generator backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic",
    "pydantic-settings",
    "email-validator",
    "reportlab",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "pypdf",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM115"]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
